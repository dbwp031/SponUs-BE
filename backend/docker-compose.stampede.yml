name: sponus-stampede

# 여러 서버(app1~3) + nginx LB + 전용 mysql/redis 로 cache stampede 를 재현/완화하는 실험 스택.
# 기존 로컬 인프라(sponus-mysql:3307, redis:6379/6381)와 충돌하지 않도록 host 포트를 분리했다.
# app 은 컨테이너 네트워크에서 서비스명(mysql:3306, redis:6379)으로 접속한다.

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.stampede
  image: sponus-app:stampede
  environment:
    TZ: Asia/Seoul
  # ENTRYPOINT 의 -Dspring.profiles.active=prod 보다 우선하는 커맨드라인 인자(--x)로 오버라이드
  command:
    - "--spring.profiles.active=local"
    - "--spring.datasource.url=jdbc:mysql://mysql:3306/sponus?useSSL=false&allowPublicKeyRetrieval=true"
    - "--spring.datasource.username=root"
    - "--spring.datasource.password=root1234!"
    - "--spring.jpa.hibernate.ddl-auto=update"
    - "--spring.data.redis.host=redis"
    - "--spring.data.redis.port=6379"
    - "--announcement.cache.stampede-lock-enabled=${STAMPEDE_LOCK:-true}"  # true=완화 / false=stampede 재현
    - "--announcement.cache.ttl-seconds=${TTL_SECONDS:-10}"
    - "--announcement.cache.jitter-seconds=${JITTER_SECONDS:-0}"
    - "--announcement.cache.simulated-db-cost-ms=${COST_MS:-200}"
    - "--announcement.cache.double-delete-delay-ms=${DOUBLE_DELETE_MS:-1000}"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  mysql:
    image: mysql:8.4
    container_name: stampede-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234!
      MYSQL_DATABASE: sponus
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234!"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: stampede-redis
    ports:
      - "6382:6379"

  app1:
    <<: *app-common
    container_name: stampede-app1
  app2:
    <<: *app-common
    container_name: stampede-app2
  app3:
    <<: *app-common
    container_name: stampede-app3

  nginx:
    image: nginx:alpine
    container_name: stampede-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/stampede.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
